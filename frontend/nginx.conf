server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to Azure backend Container App (internal)
    location /api {
        proxy_pass https://a2s-backend.internal.wonderfuldesert-13f722e8.centralindia.azurecontainerapps.io;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host a2s-backend.internal.wonderfuldesert-13f722e8.centralindia.azurecontainerapps.io;
        proxy_cache_bypass $http_upgrade;
        proxy_ssl_server_name on;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
