spring.application.name=a2s-backend
server.port=8080

# Database Configuration — Azure SQL Server (production) or H2 (local dev)
spring.datasource.url=${DB_URL:jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MSSQLServer}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=${DB_DIALECT:org.hibernate.dialect.H2Dialect}

# H2 Console (local dev only)
spring.h2.console.enabled=${H2_CONSOLE:false}

# Security
jwt.secret=${JWT_SECRET:c2VjcmV0S2V5U2hvdWxkQmVMb25nRW5vdWdoRm9yU2VjdXJpdHlQdXJwb3Nlc1NhbXBsZXMxMjM0NTY3ODkw}
jwt.expiration=86400000

# CORS — comma-separated list of allowed origins
# In Azure, set CORS_ORIGINS to your frontend Container App FQDN
cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

# Logging — reduced verbosity for production readiness
logging.level.root=INFO
logging.level.a2s=INFO
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:WARN}
logging.level.org.springframework.web=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Validation
spring.mvc.throw-exception-if-no-handler-found=true

# OAuth2 Configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:your-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:your-client-secret}
spring.security.oauth2.client.registration.google.scope=profile,email

spring.security.oauth2.client.registration.apple.client-id=${APPLE_CLIENT_ID:your-client-id}
spring.security.oauth2.client.registration.apple.client-secret=${APPLE_CLIENT_SECRET:your-client-secret}
spring.security.oauth2.client.registration.apple.scope=name,email
spring.security.oauth2.client.registration.apple.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.apple.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.provider.apple.authorization-uri=https://appleid.apple.com/auth/authorize
spring.security.oauth2.client.provider.apple.token-uri=https://appleid.apple.com/auth/token
spring.security.oauth2.client.provider.apple.jwk-set-uri=https://appleid.apple.com/auth/keys
spring.security.oauth2.client.provider.apple.user-name-attribute=sub

# App OAuth2 Redirect
app.oauth2.redirect-uri=${OAUTH2_REDIRECT_URI:http://localhost:3000/login}
