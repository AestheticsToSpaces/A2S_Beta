name: Deploy to Azure Container Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  RESOURCE_GROUP: a2ws
  ACR_NAME: a2sacr
  ACR_LOGIN_SERVER: a2sacr.azurecr.io
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build & push backend image
        run: |
          docker build -t ${{ env.ACR_LOGIN_SERVER }}/a2s-backend:${{ env.IMAGE_TAG }} ./backend
          docker push ${{ env.ACR_LOGIN_SERVER }}/a2s-backend:${{ env.IMAGE_TAG }}

      - name: Deploy backend
        run: |
          az containerapp update \
            --name a2s-backend \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.ACR_LOGIN_SERVER }}/a2s-backend:${{ env.IMAGE_TAG }} \
            --set-env-vars \
              DB_URL="${{ secrets.DB_URL }}" \
              DB_USER="${{ secrets.DB_USER }}" \
              DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
              DB_DRIVER="org.postgresql.Driver" \
              DB_DIALECT="org.hibernate.dialect.PostgreSQLDialect" \
              JWT_SECRET="${{ secrets.JWT_SECRET }}" \
              JWT_EXPIRATION="86400000" \
              CORS_ORIGINS="https://a2s-frontend.wonderfuldesert-13f722e8.centralindia.azurecontainerapps.io" \
              OAUTH2_REDIRECT_URI="https://a2s-frontend.wonderfuldesert-13f722e8.centralindia.azurecontainerapps.io/#/dashboard" \
              GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}" \
              GOOGLE_CLIENT_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}" \
              SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}" \
              SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}" \
              SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_REDIRECT_URI="https://a2s-frontend.wonderfuldesert-13f722e8.centralindia.azurecontainerapps.io/login/oauth2/code/google" \
              LLM_SERVICE_URL="https://a2s-llm.internal.wonderfuldesert-13f722e8.centralindia.azurecontainerapps.io" \
              GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}" \
              GROQ_API_KEY="${{ secrets.GROQ_API_KEY }}"

          # Ensure backend remains reachable via ACA FQDN after each revision update.
          az containerapp ingress enable \
            --name a2s-backend \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --type external \
            --target-port 8080 || true

          # Safety net: recover from stale/no-traffic backend revision states without
          # breaking deployment if a command is unsupported in the current CLI profile.
          az containerapp ingress traffic set \
            --name a2s-backend \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --revision-weight latest=100 || true

          az containerapp revision set-mode \
            --name a2s-backend \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --mode single || true

      - name: Build & push LLM image
        run: |
          docker build -t ${{ env.ACR_LOGIN_SERVER }}/a2s-llm:${{ env.IMAGE_TAG }} ./LLM
          docker push ${{ env.ACR_LOGIN_SERVER }}/a2s-llm:${{ env.IMAGE_TAG }}

      - name: Build & push frontend image
        run: |
          docker build -t ${{ env.ACR_LOGIN_SERVER }}/a2s-frontend:${{ env.IMAGE_TAG }} ./frontend
          docker push ${{ env.ACR_LOGIN_SERVER }}/a2s-frontend:${{ env.IMAGE_TAG }}

      - name: Deploy LLM
        run: |
          az containerapp update \
            --name a2s-llm \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.ACR_LOGIN_SERVER }}/a2s-llm:${{ env.IMAGE_TAG }} \
            --set-env-vars \
              GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}" \
              GROQ_API_KEY="${{ secrets.GROQ_API_KEY }}" \
              PORT="5001"

      - name: Deploy frontend
        run: |
          az containerapp update \
            --name a2s-frontend \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.ACR_LOGIN_SERVER }}/a2s-frontend:${{ env.IMAGE_TAG }}

