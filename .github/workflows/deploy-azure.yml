name: Deploy to Azure Container Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  RESOURCE_GROUP: a2ws
  ACR_NAME: a2sacr
  ACR_LOGIN_SERVER: a2sacr.azurecr.io

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build & push backend image
        run: |
          docker build -t ${{ env.ACR_LOGIN_SERVER }}/a2s-backend:latest ./backend
          docker push ${{ env.ACR_LOGIN_SERVER }}/a2s-backend:latest

      - name: Build & push LLM image
        run: |
          docker build -t ${{ env.ACR_LOGIN_SERVER }}/a2s-llm:latest ./LLM
          docker push ${{ env.ACR_LOGIN_SERVER }}/a2s-llm:latest

      - name: Build & push frontend image
        run: |
          docker build -t ${{ env.ACR_LOGIN_SERVER }}/a2s-frontend:latest ./frontend
          docker push ${{ env.ACR_LOGIN_SERVER }}/a2s-frontend:latest

      - name: Deploy backend
        run: |
          az containerapp update \
            --name a2s-backend \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.ACR_LOGIN_SERVER }}/a2s-backend:latest \
            --set-env-vars \
              DB_URL="${{ secrets.DB_URL }}" \
              DB_USER="${{ secrets.DB_USER }}" \
              DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
              DB_DRIVER="org.postgresql.Driver" \
              DB_DIALECT="org.hibernate.dialect.PostgreSQLDialect" \
              JWT_SECRET="${{ secrets.JWT_SECRET }}" \
              JWT_EXPIRATION="86400000" \
              CORS_ORIGINS="https://a2s-frontend.wonderfuldesert-13f722e8.centralindia.azurecontainerapps.io" \
              LLM_SERVICE_URL="https://a2s-llm.wonderfuldesert-13f722e8.centralindia.azurecontainerapps.io" \
              GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}" \
              GROQ_API_KEY="${{ secrets.GROQ_API_KEY }}"

      - name: Deploy LLM
        run: |
          az containerapp update \
            --name a2s-llm \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.ACR_LOGIN_SERVER }}/a2s-llm:latest

      - name: Deploy frontend
        run: |
          az containerapp update \
            --name a2s-frontend \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.ACR_LOGIN_SERVER }}/a2s-frontend:latest
